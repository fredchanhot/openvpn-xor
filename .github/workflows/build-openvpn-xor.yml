name: Build OpenVPN with XOR Patch

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get --yes install \
            build-essential libssl-dev iproute2 liblz4-dev liblzo2-dev \
            libpam0g-dev libpkcs11-helper1-dev libsystemd-dev resolvconf \
            pkg-config autoconf automake libtool libcap-ng-dev libnl-genl-3-dev

      - name: Download Core OpenVPN Source
        run: |
          curl -L "https://github.com" -o openvpn.tar.gz
          tar -xzf openvpn.tar.gz
          mv openvpn-2.6.12 openvpn-src

      - name: Create and Apply Tunnelblick XOR Patch
