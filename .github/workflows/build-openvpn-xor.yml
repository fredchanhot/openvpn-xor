          bnQpIFwKEOF

          # Decode it cleanly out of the YAML runtime stream
          base64 -d xor_patch.diff.base64 > xor_patch.diff
          patch -p1 < xor_patch.diff

      - name: Configure and Compile OpenVPN
        run: |
          cd openvpn-src
          libtoolize --force
          aclocal
          autoheader
          automake --force-missing --add-missing
          autoconf
          
          ./configure \
            --enable-systemd \
            --enable-async-push \
            --enable-management \
            --enable-plugins \
            --disable-dco
            
          make -j$(nproc)

      - name: Prepare Binary for Artifact Upload
        run: |
          mkdir -p build_output
          cp openvpn-src/src/openvpn/openvpn build_output/openvpn-xor-linux
          chmod +x build_output/openvpn-xor-linux

      - name: Upload Patched OpenVPN Binary
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-xor-linux-binary
          path: build_output/openvpn-xor-linux
          retention-days: 7
