name: Build OpenVPN with XOR Patch

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get --yes install \
            build-essential libssl-dev iproute2 liblz4-dev liblzo2-dev \
            libpam0g-dev libpkcs11-helper1-dev libsystemd-dev resolvconf \
            pkg-config autoconf automake libtool libcap-ng-dev libnl-genl-3-dev

      - name: Download Core OpenVPN Source
        run: |
          curl -L "https://github.com/OpenVPN/openvpn/releases/download/v2.6.12/openvpn-2.6.12.tar.gz" -o openvpn.tar.gz
          tar -xzf openvpn.tar.gz
          mv openvpn-2.6.12 openvpn-src

      - name: Download and Apply Tunnelblick XOR Patch
        run: |
          cd openvpn-src
          wget "https://githubusercontent.com" -O xor_patch.diff
          patch -p1 < xor_patch.diff

      - name: Configure and Compile OpenVPN
        run: |
          cd openvpn-src
          # Generate tracking configurations cleanly post-patch
          libtoolize --force
          aclocal
          autoheader
          automake --force-missing --add-missing
          autoconf
          
          ./configure \
            --enable-systemd \
            --enable-async-push \
            --enable-management \
            --enable-plugins \
            --disable-dco
            
          make -j$(nproc)

      - name: Prepare Binary for Artifact Upload
        run: |
          mkdir -p build_output
          cp openvpn-src/src/openvpn/openvpn build_output/openvpn-xor-linux
          chmod +x build_output/openvpn-xor-linux

      - name: Upload Patched OpenVPN Binary
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-xor-linux-binary
          path: build_output/openvpn-xor-linux
          retention-days: 7

